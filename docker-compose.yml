services:
  postgres:
    image: postgres:16
    container_name: quit-smoking-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change_me_please
      POSTGRES_DB: quitsmoke
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
